version: "2"
run:
  go: "1.25"
  build-tags: [cgo]
linters:
  default: none
  enable: [errcheck, govet, ineffassign, staticcheck, unused, misspell, unconvert]
  exclusions:
    paths:
      - internal/parser/grammars
      - testdata
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable: [gofmt]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build aid
        run: CGO_ENABLED=1 CGO_CFLAGS=-w go build -o "$RUNNER_TEMP/aid" ./cmd/aid
      - name: Test
        env:
          AID_TEST_BINARY: ${{ runner.temp }}/aid
        run: CGO_ENABLED=1 CGO_CFLAGS=-w go test -count=1 $(go list -e ./... | grep -vE '/tools/|/test_project/|/cmd/aid-validate')

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and smoke test
        run: |
          CGO_ENABLED=1 CGO_CFLAGS=-w go build -o aid ./cmd/aid
          ./aid --version < /dev/null
          ./aid testdata/python/01_basic/source.py --stdout --summary-type=off < /dev/null | grep -q 'is_valid_email'

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: CGO_ENABLED=1 CGO_CFLAGS=-w go vet $(go list -e ./... | grep -vE '/tools/|/test_project/|/cmd/aid-validate')
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: No pinned versions
        run: sh scripts/version-drift.sh
      - name: Installer version resolution
        run: sh scripts/tests/install_sh_test.sh
      - name: cgo stays enabled
        run: sh scripts/check-cgo.sh

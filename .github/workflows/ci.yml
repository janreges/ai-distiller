name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build aid
        run: CGO_ENABLED=1 CGO_CFLAGS="-O2 -w" go build -o "$RUNNER_TEMP/aid" ./cmd/aid
      - name: Test
        env:
          AID_TEST_BINARY: ${{ runner.temp }}/aid
        run: CGO_ENABLED=1 CGO_CFLAGS="-O2 -w" go test -count=1 $(go list -e ./... | grep -vE '/tools/|/test_project/|/cmd/aid-validate')

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      # The minimum macOS of the release binaries (release.yml); Linux ignores it.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and smoke test
        run: |
          CGO_ENABLED=1 CGO_CFLAGS="-O2 -w" go build -o aid ./cmd/aid
          ./aid --version < /dev/null
          ./aid testdata/python/01_basic/source.py --stdout --summary-type=off < /dev/null | grep -q 'is_valid_email'
      - name: Minimum macOS version is 14.0
        if: runner.os == 'macOS'
        run: |
          otool -l aid | grep -A4 LC_BUILD_VERSION
          otool -l aid | grep -A4 LC_BUILD_VERSION | grep -qE 'minos 14\.0$'

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          files=$(git ls-files 'cmd/*.go' 'internal/*.go' | grep -vE '/testdata/|^internal/parser/grammars/')
          out=$(gofmt -s -l $files)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: go vet
        run: CGO_ENABLED=1 CGO_CFLAGS="-O2 -w" go vet $(go list -e ./... | grep -vE '/tools/|/test_project/|/cmd/aid-validate')
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: "-O2 -w"
        with:
          version: v2.12.2
          only-new-issues: true
          args: ./cmd/... ./internal/...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: No pinned versions
        run: sh scripts/version-drift.sh
      - name: Installer version resolution
        run: sh scripts/tests/install_sh_test.sh
      - name: cgo stays enabled
        run: sh scripts/check-cgo.sh
      - name: Skill anchors
        run: sh scripts/tests/check_skill_anchors_test.sh && sh scripts/check-skill-anchors.sh
      - name: README links
        run: sh scripts/tests/readme_links_test.sh

  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node that package.json engines.node allows, and newer.
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: mcp-npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-npm/package-lock.json
      - run: npm ci
      - run: npm test
